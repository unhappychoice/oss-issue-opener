name: Weekly OSS Maintenance Check

on:
  schedule:
    - cron: '0 0 * * 6' # Every Saturday 9:00 JST (0:00 UTC)
  workflow_dispatch: # Manual trigger

concurrency:
  group: oss-issue-opener-notifications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Check repositories and create issues
        env:
          GH_TOKEN: ${{ secrets.OSS_GITHUB_TOKEN }}
        run: npm run start
